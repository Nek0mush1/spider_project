[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douban_books"
version = "0.1.0"
description = "Douban Books Scraper"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "scrapy-playwright",
    "playwright",
    "playwright-stealth==2.0.3",
    "pandas",
    "psycopg2-binary",
    "SQLAlchemy",
    "python-dotenv",
]

[tool.pytest.ini_options]
markers = ["integration: requires TEST_DATABASE_URL ending in _test"]
