services:
  postgres:
    image: postgres:16-alpine
    container_name: douban-pg
    environment:
      POSTGRES_USER: douban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-douban}
      POSTGRES_DB: douban_books
    ports:
      - "5434:5432"
    volumes:
      - pgdata_douban:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douban -d douban_books"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_douban:
