services:
  postgres:
    image: postgres:16-alpine
    container_name: dangdang-pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dangdang
      POSTGRES_PASSWORD: dangdang
      POSTGRES_DB: dangdang_books
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
      - ./data/books.csv:/tmp/books.csv:ro
    restart: unless-stopped

volumes:
  pgdata:
