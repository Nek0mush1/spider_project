services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: douban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-douban}
      POSTGRES_DB: douban_books
    ports:
      - "5434:5432"
    volumes:
      - pgdata_douban:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U douban -d douban_books"]
      interval: 10s
      timeout: 5s
      retries: 5

  xvfb:
    image: jlesage/baseimage-gui:alpine-3.22-v4
    environment:
      DISPLAY_WIDTH: 1440
      DISPLAY_HEIGHT: 1024
      KEEP_APP_RUNNING: 1
    ports:
      - "5800:5800"

volumes:
  pgdata_douban:
